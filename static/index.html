<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Login</title>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <!-- 卡密验证模态框 -->
    <div class="card-verify-modal" id="cardVerifyModal">
        <div class="card-verify-box">
            <h2>请输入卡密</h2>
            <p>使用本服务需要有效的卡密</p>
            <input type="text" id="cardKeyInput" placeholder="auto-login-XXXX-XXXX-XXXX" maxlength="30">
            <div class="error-message" id="cardErrorMsg" style="display: none;"></div>
            <button class="verify-btn" id="verifyCardBtn" onclick="verifyCard()">验证</button>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="mainContent" style="display: none;">
        <div id="cardInfo"></div>
        <button class="logout-btn" onclick="logout()">退出登录</button>
        
        <div class="container">
            <div class="count-display">
                <span class="label">剩余账号</span>
                <span class="count" id="accountCount">-</span>
            </div>
            
            <div class="input-group">
                <input type="text" id="deviceCode" placeholder="输入设备代码 (8位)" maxlength="8">
            </div>
            
            <button class="login-btn" id="loginBtn">登录</button>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <svg class="icon" id="modalIcon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <p class="message" id="modalMessage">登录成功</p>
            <button class="close-btn" id="closeBtn">确定</button>
        </div>
    </div>
    
    <script src="js/user.js"></script>
</body>
</html>
